name: Apply final generalization regression fix

on:
  push:
    branches:
      - agent/final-portable-test-cleanup

permissions:
  contents: write

jobs:
  fix-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-portable-test-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add empty-run guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/wwgpt/generalization_analysis.py")
          text = path.read_text()
          old = '''    runs = filter_runs(
        discover_completed_runs(Path(results_root)),
        level=level,
        token_multiplier=token_multiplier,
    )
    if base_optimizer:
'''
          new = '''    runs = filter_runs(
        discover_completed_runs(Path(results_root)),
        level=level,
        token_multiplier=token_multiplier,
    )
    if runs.empty or "base_optimizer" not in runs.columns:
        return pd.DataFrame()
    if base_optimizer:
'''
          if text.count(old) != 1:
              raise RuntimeError(f"expected one generalization guard target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/agent-fix-generalization-empty.yml
      - name: Install and validate regression
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[notebooks]"
          python -m pip install pytest ruff
          python -m compileall -q src tests
          ruff check src tests
          pytest -q tests/test_schema_v2_analysis.py::test_notebooks_parse_and_execute_fixture --tb=short
          git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Handle empty generalization result sets"
          git push origin HEAD:agent/final-portable-test-cleanup
