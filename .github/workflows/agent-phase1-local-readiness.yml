name: Apply phase-one local readiness changes

on:
  push:
    branches:
      - agent/final-local-mac-readiness
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-local-mac-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source changes
        run: python scripts/_agent_phase1_local_readiness.py
      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[notebooks]"
          python -m pip install pytest ruff
      - name: Validate source changes
        run: |
          python -m compileall -q src tests
          ruff check src tests
          pytest -q -m "not slow" --tb=short
          wwgpt local-readiness --device cpu --levels 0,1,2 --optimizers adamw --output artifacts/local-readiness
          git diff --check
      - name: Commit validated changes
        if: github.event_name == 'push'
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Add robust local Mac experiment readiness"
          git push origin HEAD:agent/final-local-mac-readiness
