name: Apply phase-two health workflow changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-local-mac-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize the phase-two source helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/_agent_phase2_health_workflow.py')
          text = path.read_text()

          old = (
              "replace_once(\n"
              "    train_path,\n"
              "    '        \"scheduler_implementation\": SCHEDULER_IMPLEMENTATION,\\n',\n"
              "    '        \"scheduler_implementation\": SCHEDULER_IMPLEMENTATION,\\n'\n"
              "    '        \"learning_rate_resolution\": dict(learning_rate_resolution or {}),\\n',\n"
              ")\n"
          )
          new = (
              "replace_once(\n"
              "    train_path,\n"
              "    '        \"model_architecture_version\": model.model_architecture_version,\\n'\n"
              "    '        \"scheduler_implementation\": SCHEDULER_IMPLEMENTATION,\\n',\n"
              "    '        \"model_architecture_version\": model.model_architecture_version,\\n'\n"
              "    '        \"scheduler_implementation\": SCHEDULER_IMPLEMENTATION,\\n'\n"
              "    '        \"learning_rate_resolution\": dict(learning_rate_resolution or {}),\\n',\n"
              ")\n"
          )
          if old in text:
              text = text.replace(old, new, 1)

          old = (
              'def _model_diagnostic_metrics(model: torch.nn.Module) -> dict[str, float | int]:\\n'
              '    total_sq = 0.0\\n'
          )
          new = (
              'def _model_diagnostic_metrics(model: torch.nn.Module) -> dict[str, float | int]:\\n'
              '    from wwgpt.ww import is_projected_layer\\n\\n'
              '    total_sq = 0.0\\n'
          )
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Apply source changes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/phase2
          python scripts/_agent_phase2_health_workflow.py 2>&1 | tee artifacts/phase2/apply.log
          python - <<'PY'
          from pathlib import Path

          path = Path('src/wwgpt/train.py')
          text = path.read_text()
          old = (
              '    write_json(run_dir / "run_complete.json", common_complete)\n'
              '    _log_train_progress(\n'
          )
          new = (
              '    (run_dir / "run_complete.json").write_text(\n'
              '        json.dumps(common_complete, indent=2, sort_keys=True, default=str) + "\\n"\n'
              '    )\n'
              '    _log_train_progress(\n'
          )
          if text.count(old) != 1:
              raise RuntimeError(
                  f'expected exactly one post-health completion write, found {text.count(old)}'
              )
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Restore helper sources before commit
        run: |
          git checkout -- scripts/_agent_phase2_health_workflow.py
          git checkout -- scripts/_fix_phase2_helper.py
      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[notebooks]"
          python -m pip install pytest ruff
      - name: Validate source changes
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src tests 2>&1 | tee artifacts/phase2/compile.log
          ruff check src tests 2>&1 | tee artifacts/phase2/ruff.log
          pytest -q -m "not slow" --tb=short 2>&1 | tee artifacts/phase2/pytest.log
          git diff --check
      - name: Upload phase-two diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-two-health-workflow-logs
          path: artifacts/phase2/**
          if-no-files-found: warn
      - name: Commit validated changes
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Add run health and reusable local workflow"
          git push origin HEAD:agent/final-local-mac-readiness
