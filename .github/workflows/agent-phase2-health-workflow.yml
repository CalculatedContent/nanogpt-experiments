name: Apply phase-two health workflow changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-local-mac-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source changes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/phase2
          python scripts/_agent_phase2_health_workflow.py 2>&1 | tee artifacts/phase2/apply.log
      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[notebooks]"
          python -m pip install pytest ruff
      - name: Validate source changes
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src tests 2>&1 | tee artifacts/phase2/compile.log
          ruff check src tests 2>&1 | tee artifacts/phase2/ruff.log
          pytest -q -m "not slow" --tb=short 2>&1 | tee artifacts/phase2/pytest.log
          git diff --check
      - name: Upload phase-two diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-two-health-workflow-logs
          path: artifacts/phase2/**
          if-no-files-found: warn
      - name: Commit validated changes
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Add run health and reusable local workflow"
          git push origin HEAD:agent/final-local-mac-readiness
