name: Apply final analysis and Mac workflow changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-local-mac-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate final source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase3/part*.b64 | base64 --decode > /tmp/phase3.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/phase3.py')
          text = path.read_text()
          root_old = 'ROOT = Path(__file__).resolve().parents[1]'
          if text.count(root_old) != 1:
              raise RuntimeError(f'expected one repository-root patch target, found {text.count(root_old)}')
          text = text.replace(root_old, 'ROOT = Path.cwd()', 1)
          old = 'monkeypatch.setattr(module, "_model_device", lambda _model: torch.device("mps"))'
          new = 'monkeypatch.setattr(module, "_model_device", lambda candidate: torch.device("mps") if candidate is model else torch.device("cpu"))'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one MPS test patch target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python /tmp/phase3.py
          base64 --decode .github/phase3/build_experiment_config.b64 > scripts/build_experiment_config.py
          chmod +x scripts/build_experiment_config.py
          base64 --decode .github/phase3/lint_patch.b64 > /tmp/phase3_lint.py
          python /tmp/phase3_lint.py
          rm -rf .github/phase3
          rm .github/workflows/agent-phase3-final-analysis.yml
      - name: Compile and lint generated source
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[notebooks]"
          python -m pip install pytest ruff
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          git diff --check
      - name: Commit generated source
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Complete local Level 0-2 WWPGD experiment workflow"
          git push origin HEAD:agent/final-local-mac-readiness
