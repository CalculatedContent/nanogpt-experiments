name: Apply validated Level 0-2 repair

on:
  push:
    branches:
      - agent/fix-level0-2-end-to-end

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-level0-2-end-to-end
          fetch-depth: 0
      - name: Apply sandbox-validated trainer and test patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git apply --check .github/repair-patches/core.patch
          git apply --check .github/repair-patches/tests.patch
          git apply .github/repair-patches/core.patch
          git apply .github/repair-patches/tests.patch

          rm -rf .github/repair-patches
          rm -f .github/workflows/export-source.yml
          rm -f .github/workflows/apply-level0-2-repair.yml

          python -m compileall -q src tests
          bash -n scripts/run_one_pair.sh
          bash -n scripts/run_local_mac_experiments.sh
          git diff --check

          git add -A
          git commit -m "Repair Level 0-2 local experiment execution"
          git push origin HEAD:agent/fix-level0-2-end-to-end
