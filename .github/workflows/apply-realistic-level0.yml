name: Apply corrected realistic isolated Level 0 baseline

on:
  push:
    branches:
      - agent/correct-realistic-level0-baseline
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-level0:
    if: >-
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/correct-realistic-level0-baseline')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correct-realistic-level0-baseline
          fetch-depth: 0

      - name: Reconstruct exact locally validated Level 0 tree
        shell: bash
        run: |
          set -euo pipefail
          cat .level0-update/part* | base64 --decode > /tmp/level0.tar.gz
          echo '393ca945e35a43ec3a42092af6b8a5ed1fab1bc7c72ace6f5f80d9fb3ad1ac92  /tmp/level0.tar.gz' \
            | sha256sum --check --strict
          rm -rf level_0_baseline
          mkdir -p level_0_baseline
          tar -xzf /tmp/level0.tar.gz -C level_0_baseline
          chmod +x level_0_baseline/scripts/*.sh
          rm -rf .level0-update
          git add -A
          git diff --cached --check
          python -m compileall -q level_0_baseline/src level_0_baseline/tests
          bash -n level_0_baseline/scripts/*.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install isolated Level 0 package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e 'level_0_baseline[test]'

      - name: Run isolated Level 0 regression suite
        run: pytest -q level_0_baseline/tests/test_baseline.py

      - name: Commit exact validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Correct isolated Level 0 GPT-2-BPE baseline'
          git push origin HEAD:agent/correct-realistic-level0-baseline
