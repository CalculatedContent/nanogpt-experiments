name: Apply release-readiness audit source patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-source:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-readiness-audit
          fetch-depth: 0
      - name: Apply exact validated non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release-audit/patch.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/release-audit.patch
          echo 'fbc0bdcf8f8df12b68009cd14c496aa0c272f8d0457e4b2eaf599bc450fa8f0d  /tmp/release-audit.patch' \
            | sha256sum --check --strict
          git apply --index --whitespace=error-all \
            --exclude=.github/workflows/ci.yml \
            /tmp/release-audit.patch
          git diff --cached --check
          python -m compileall -q src tests scripts
          bash -n scripts/*.sh
          git diff --cached --stat
      - name: Commit validated source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Complete Level 0-2 local experiment release audit'
          git push origin HEAD:agent/release-readiness-audit
