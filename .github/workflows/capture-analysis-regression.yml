name: Capture analysis regression output

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  capture-regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-analysis-duplicate-metrics
          fetch-depth: 0
      - name: Normalize duplicate blocks and capture pytest output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          analysis_path = Path("src/wwgpt/acceleration_analysis.py")
          text = analysis_path.read_text()
          marker = "def _column_series(frame: pd.DataFrame, name: str) -> pd.Series | None:"
          while text.count(marker) > 1:
              first = text.index(marker)
              second = text.index(marker, first + 1)
              text = text[:first] + text[second:]
          if text.count(marker) != 1 or text.count("def _coalesce_aliases(") != 1:
              raise SystemExit("analysis alias helpers are not normalized")
          analysis_path.write_text(text)

          test_path = Path("tests/test_acceleration_analysis.py")
          tests = test_path.read_text()
          test_marker = "def production_curve(tokens, losses):"
          while tests.count(test_marker) > 1:
              first = tests.index(test_marker)
              second = tests.index(test_marker, first + 1)
              tests = tests[:first] + tests[second:]
          if tests.count(test_marker) != 1:
              raise SystemExit("production curve regression helper is not normalized")
          test_path.write_text(tests)
          PY
          mkdir -p artifacts/debug
          set +e
          pytest -q tests/test_acceleration_analysis.py > artifacts/debug/analysis-pytest.log 2>&1
          status=$?
          set -e
          echo "$status" > artifacts/debug/analysis-pytest-status.txt
      - name: Commit normalized patch and debug output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wwgpt/acceleration_analysis.py tests/test_acceleration_analysis.py artifacts/debug/analysis-pytest.log artifacts/debug/analysis-pytest-status.txt
          git commit -m "Capture analysis regression failure"
          git push origin HEAD:agent/fix-analysis-duplicate-metrics
