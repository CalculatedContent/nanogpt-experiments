name: Capture Linux Level 0-2 analysis traceback

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e . pytest
      - name: Reproduce preceding test load
        env:
          MPLBACKEND: Agg
        run: |
          pytest -q \
            tests/test_acceleration_analysis.py \
            tests/test_cached_controller_csv_routing.py \
            tests/test_cached_endpoint_relaxation.py \
            tests/test_level012_cached_end_to_end.py \
            tests/test_level012_full_pipeline.py \
            tests/test_local_level_scripts.py \
            tests/test_pass6_resume_analysis_cli_ci.py \
            tests/test_release_readiness_audit.py \
            tests/test_source_structure.py
      - name: Capture wrapper exit and traceback
        env:
          MPLBACKEND: Agg
        shell: bash
        run: |
          root=artifacts/bounded-level012-release
          mkdir -p "$root"
          set +e
          ./scripts/run_bounded_level012_acceptance.sh "$root" \
            >"$root/console.log" 2>&1
          status=$?
          printf '%s\n' "$status" >"$root/exit-code.txt"
          set -e
      - name: Upload captured result root
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-level012-analysis-traceback
          path: artifacts/bounded-level012-release/**
          if-no-files-found: error
