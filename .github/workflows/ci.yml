name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e .
          python -m pip install ruff pytest
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Ruff
        run: ruff check src tests
      - name: Reject WWPGD dependency pins and hard-coded required SHAs
        shell: bash
        run: |
          ! grep -R "WW_PGD.git""@" pyproject.toml .github scripts src tests docs README.md
          ! rg 'required.{0,40}[0-9a-f]{40}|[0-9a-f]{40}.{0,40}required' pyproject.toml .github scripts src tests docs README.md
          git diff --check

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run non-slow test suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/test-logs
          pytest -q -m "not slow" --tb=short 2>&1 | tee artifacts/test-logs/pytest.log
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-slow-pytest-log
          path: artifacts/test-logs/pytest.log
          if-no-files-found: error

  resolved-pilot-manifests:
    name: resolved pilot manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Resolve Level 0, 1, and 2 pilot execution manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolved-pilot-manifests
          for level in 0 1 2; do
            wwgpt run-multiseed \
              --level "$level" \
              --config "configs/level${level}_adaptive_alpha.yaml" \
              --data-root /tmp/wwgpt-data \
              --results-root /tmp/wwgpt-results \
              --token-multiplier 20 \
              --device cpu \
              --dry-run \
              | tail -n +2 > "artifacts/resolved-pilot-manifests/level${level}.json"
            python -m json.tool "artifacts/resolved-pilot-manifests/level${level}.json" >/dev/null
          done
      - name: Upload resolved pilot execution manifests
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pilot-execution-manifests
          path: artifacts/resolved-pilot-manifests/*.json
          if-no-files-found: error

  analysis-notebooks:
    name: analysis-notebooks
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      WWGPT_RESULTS_ROOT: tests/fixtures/schema_v2_results/experiments/level_00/multiplier_20
      WWGPT_SCALING_ROOT: tests/fixtures/schema_v2_results
      WWGPT_STRENGTH_SCAN_ROOT: tests/fixtures/strength_scan
      WWGPT_NOTEBOOK_OUTPUT_DIR: artifacts/analysis-notebooks/executed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and notebook tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest nbclient nbformat ipykernel
      - name: Execute fixture-backed analysis notebooks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/analysis-notebooks/logs "$WWGPT_NOTEBOOK_OUTPUT_DIR"
          pytest -q -m "notebook" tests/test_schema_v2_analysis.py::test_notebooks_parse_and_execute_fixture 2>&1 | tee artifacts/analysis-notebooks/logs/pytest-notebooks.log
      - name: Upload notebook failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-notebooks-failure-artifacts
          path: |
            artifacts/analysis-notebooks/**
            tests/fixtures/schema_v2_results/**/analysis/**
            tests/fixtures/schema_v2_results/**/figures/**
            tests/fixtures/strength_scan/**/analysis/**
            tests/fixtures/strength_scan/**/figures/**
          if-no-files-found: warn
