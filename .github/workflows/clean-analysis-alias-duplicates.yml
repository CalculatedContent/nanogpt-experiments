name: Clean duplicate analysis alias blocks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  clean-duplicates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-analysis-duplicate-metrics
          fetch-depth: 0
      - name: Remove duplicate helper and regression blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          analysis_path = Path("src/wwgpt/acceleration_analysis.py")
          text = analysis_path.read_text()
          marker = "def _column_series(frame: pd.DataFrame, name: str) -> pd.Series | None:"
          first = text.index(marker)
          second = text.index(marker, first + 1)
          text = text[:first] + text[second:]
          if text.count(marker) != 1:
              raise SystemExit("expected one _column_series definition after cleanup")
          if text.count("def _coalesce_aliases(") != 1:
              raise SystemExit("expected one _coalesce_aliases definition after cleanup")
          analysis_path.write_text(text)

          test_path = Path("tests/test_acceleration_analysis.py")
          tests = test_path.read_text()
          test_marker = "def production_curve(tokens, losses):"
          first = tests.index(test_marker)
          second = tests.index(test_marker, first + 1)
          tests = tests[:first] + tests[second:]
          if tests.count(test_marker) != 1:
              raise SystemExit("expected one production_curve helper after cleanup")
          if tests.count(
              "def test_curve_coalesces_production_canonical_and_legacy_columns():"
          ) != 1:
              raise SystemExit("expected one curve alias regression after cleanup")
          if tests.count(
              "def test_exploratory_analysis_accepts_production_metric_schema(tmp_path):"
          ) != 1:
              raise SystemExit("expected one exploratory regression after cleanup")
          test_path.write_text(tests)
          PY
      - name: Run focused analysis tests
        run: pytest -q tests/test_acceleration_analysis.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wwgpt/acceleration_analysis.py tests/test_acceleration_analysis.py
          git commit -m "Remove duplicate analysis alias regressions"
          git push origin HEAD:agent/fix-analysis-duplicate-metrics
