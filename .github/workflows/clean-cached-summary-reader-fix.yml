name: Clean cached summary reader fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  clean-train-reader:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-cached-summary-empty-values
          fetch-depth: 0
      - name: Remove duplicate helper block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/wwgpt/train.py")
          text = path.read_text()
          first = text.index("def _csv_truth(value: object) -> bool:")
          second = text.index("def _csv_truth(value: object) -> bool:", first + 1)
          text = text[:first] + text[second:]
          if text.count("def _csv_truth(value: object) -> bool:") != 1:
              raise SystemExit("expected exactly one _csv_truth helper after cleanup")
          if text.count("def _csv_optional_float(value: object) -> float | None:") != 1:
              raise SystemExit("expected exactly one _csv_optional_float helper after cleanup")
          path.write_text(text)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wwgpt/train.py
          git commit -m "Remove duplicate cached CSV reader helpers"
          git push origin HEAD:agent/fix-cached-summary-empty-values
