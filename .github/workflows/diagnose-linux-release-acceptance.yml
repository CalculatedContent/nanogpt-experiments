name: Diagnose Linux Level 0-2 release acceptance

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e . pytest
      - name: Run preceding bounded acceptance tests
        env:
          MPLBACKEND: Agg
        run: |
          pytest -q \
            tests/test_acceleration_analysis.py \
            tests/test_cached_controller_csv_routing.py \
            tests/test_cached_endpoint_relaxation.py \
            tests/test_level012_cached_end_to_end.py \
            tests/test_level012_full_pipeline.py \
            tests/test_local_level_scripts.py \
            tests/test_pass6_resume_analysis_cli_ci.py \
            tests/test_release_readiness_audit.py \
            tests/test_source_structure.py
      - name: Run and capture clean-process acceptance
        id: acceptance
        continue-on-error: true
        env:
          MPLBACKEND: Agg
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run_bounded_level012_acceptance.sh \
            artifacts/bounded-level012-release \
            2>&1 | tee artifacts/bounded-level012-release.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-level012-release-diagnostics
          path: |
            artifacts/bounded-level012-release/**
            artifacts/bounded-level012-release.log
          if-no-files-found: warn
      - name: Enforce acceptance result
        shell: bash
        run: |
          test "${{ steps.acceptance.outputs.exit_code }}" = "0"
