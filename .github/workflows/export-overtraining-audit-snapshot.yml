name: Export overtraining audit snapshot

on:
  push:
    branches:
      - agent/add-overtraining-mode
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/add-overtraining-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > AUDIT_COMMIT.txt
          tar \
            --exclude=.git \
            --exclude=.github/workflows/export-overtraining-audit-snapshot.yml \
            --exclude=overtraining-audit-snapshot.tar.gz \
            -czf overtraining-audit-snapshot.tar.gz .
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: overtraining-audit-snapshot
          path: |
            overtraining-audit-snapshot.tar.gz
            AUDIT_COMMIT.txt
          if-no-files-found: error
          retention-days: 1
