name: Export release audit snapshot

on:
  push:
    branches:
      - agent/release-readiness-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > AUDIT_COMMIT.txt
          find . -path './.git' -prune -o -type f -print | sort > AUDIT_FILE_INVENTORY.txt
          tar --exclude=.git --exclude=release-audit-snapshot.tar.gz -czf release-audit-snapshot.tar.gz .
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-snapshot
          path: |
            release-audit-snapshot.tar.gz
            AUDIT_COMMIT.txt
            AUDIT_FILE_INVENTORY.txt
          if-no-files-found: error
          retention-days: 1
