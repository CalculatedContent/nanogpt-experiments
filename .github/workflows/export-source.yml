name: Export source for local validation

on:
  push:
    branches:
      - agent/fix-level0-2-end-to-end

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: nanogpt-experiments-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
