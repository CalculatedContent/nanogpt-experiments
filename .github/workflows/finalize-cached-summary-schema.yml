name: Finalize cached summary schema

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize-schema:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-cached-summary-empty-values
          fetch-depth: 0
      - name: Finalize first-write union schema and regression ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checkpointing = Path("src/wwgpt/checkpointing.py")
          text = checkpointing.read_text()
          old = '''    else:
              fields = list(rows[0])
          with path.open("a", newline="") as f:
          '''
          new = '''    else:
              fields = (
                  list(dict.fromkeys(key for row in rows for key in row))
                  if path.name == "wwpgd_endpoint_relaxation.csv"
                  else list(rows[0])
              )
          with path.open("a", newline="") as f:
          '''
          if old not in text:
              raise SystemExit("first-write schema block was not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              '"sha256_verified": True,"size_verified": True',
              '"sha256_verified": True, "size_verified": True',
              1,
          )
          checkpointing.write_text(text)

          test_path = Path("tests/test_cached_controller_csv_routing.py")
          tests = test_path.read_text()
          old_test = '''    append_csv_records(relaxation, [changed_row])
              # Terminal rows intentionally omit movement fields. They are a valid subset of
              # the established relaxation schema and must remain parseable at completion.
              append_csv_records(relaxation, [terminal_row])
          '''
          new_test = '''    # A terminal row may be first in the initial batch. The writer must build
              # the relaxation header from the union without losing later movement fields.
              append_csv_records(relaxation, [terminal_row, changed_row])
          '''
          if old_test not in tests:
              raise SystemExit("terminal-row regression setup was not found")
          tests = tests.replace(old_test, new_test, 1)
          tests = tests.replace(
              'assert relaxation_rows[1]["controller_gain_requested"] is None\n'
              '    assert relaxation_rows[1]["changed"] is False\n'
              '    assert relaxation_rows[1]["converged"] is True',
              'assert relaxation_rows[0]["controller_gain_requested"] is None\n'
              '    assert relaxation_rows[0]["changed"] is False\n'
              '    assert relaxation_rows[0]["converged"] is True',
              1,
          )
          test_path.write_text(tests)
          PY
      - name: Commit final schema fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wwgpt/checkpointing.py tests/test_cached_controller_csv_routing.py
          git commit -m "Finalize cached relaxation CSV schema"
          git push origin HEAD:agent/fix-cached-summary-empty-values
