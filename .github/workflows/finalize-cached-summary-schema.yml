name: Finalize cached summary schema

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize-schema:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-cached-summary-empty-values
          fetch-depth: 0
      - name: Normalize first-write union schema indentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/wwgpt/checkpointing.py")
          text = path.read_text()
          function_start = text.index("def append_csv_records(")
          block_start = text.index("    else:\n        fields = (", function_start)
          block_end = text.index('\n    with path.open("a", newline="") as f:', block_start)
          replacement = "\n".join(
              [
                  "    else:",
                  "        fields = (",
                  "            list(dict.fromkeys(key for row in rows for key in row))",
                  '            if path.name == "wwpgd_endpoint_relaxation.csv"',
                  "            else list(rows[0])",
                  "        )",
              ]
          )
          text = text[:block_start] + replacement + text[block_end:]
          text = text.replace(
              '"sha256_verified": True,"size_verified": True',
              '"sha256_verified": True, "size_verified": True',
              1,
          )
          path.write_text(text)
          PY
      - name: Commit formatting correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wwgpt/checkpointing.py
          git commit -m "Format cached relaxation CSV schema"
          git push origin HEAD:agent/fix-cached-summary-empty-values
