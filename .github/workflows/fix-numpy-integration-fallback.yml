name: Fix NumPy integration fallback

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix-integration:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-readiness-audit
          fetch-depth: 0
      - name: Apply NumPy 1.x and 2.x integration fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/wwgpt/acceleration_analysis.py')
          text = source.read_text()
          marker = 'def paired_auc(baseline: pd.DataFrame, wwpgd: pd.DataFrame) -> dict[str, Any]:\n'
          helper = (
              'def _trapezoidal_integral(y: np.ndarray, x: np.ndarray) -> float:\n'
              '    """Integrate on NumPy 1.x, NumPy 2.x, or a stripped compatibility build."""\n'
              '    integration = getattr(np, "trapezoid", None)\n'
              '    if integration is None:\n'
              '        integration = getattr(np, "trapz", None)\n'
              '    if integration is not None:\n'
              '        return float(integration(y, x))\n'
              '    x_values = np.asarray(x, dtype=float)\n'
              '    y_values = np.asarray(y, dtype=float)\n'
              '    if len(x_values) < 2:\n'
              '        return 0.0\n'
              '    widths = np.diff(x_values)\n'
              '    heights = (y_values[:-1] + y_values[1:]) * 0.5\n'
              '    return float(np.sum(widths * heights))\n\n\n'
          )
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit('paired_auc insertion marker not found')
              text = text.replace(marker, helper + marker, 1)
          old = (
              '    integration = getattr(np, "trapezoid", np.trapz)\n'
              '    aa, ba = float(integration(ay, grid)), float(integration(by, grid))\n'
          )
          new = (
              '    aa = _trapezoidal_integral(ay, grid)\n'
              '    ba = _trapezoidal_integral(by, grid)\n'
          )
          if old not in text:
              raise SystemExit('old eager NumPy integration block not found')
          source.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_acceleration_analysis.py')
          test_text = tests.read_text()
          old_test = (
              'def test_paired_auc_supports_numpy_one_without_trapezoid(monkeypatch):\n'
              '    monkeypatch.delattr(np, "trapezoid", raising=False)\n'
              '    result = paired_auc(curve([0, 50, 100], [3, 2, 1]), curve([0, 50, 100], [3, 2, 1]))\n'
              '    assert result["paired_auc_difference"] == 0\n'
          )
          new_test = (
              'def test_paired_auc_supports_numpy_without_integration_aliases(monkeypatch):\n'
              '    monkeypatch.delattr(np, "trapezoid", raising=False)\n'
              '    monkeypatch.delattr(np, "trapz", raising=False)\n'
              '    result = paired_auc(curve([0, 50, 100], [3, 2, 1]), curve([0, 50, 100], [3, 2, 1]))\n'
              '    assert result["paired_auc_difference"] == 0\n'
          )
          if old_test not in test_text:
              raise SystemExit('NumPy fallback regression test block not found')
          tests.write_text(test_text.replace(old_test, new_test, 1))
          PY
          python -m compileall -q src tests
          pytest -q tests/test_acceleration_analysis.py tests/test_level012_full_pipeline.py
          git diff --check
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wwgpt/acceleration_analysis.py tests/test_acceleration_analysis.py
          git commit -m 'Support NumPy integration APIs across releases'
          git push origin HEAD:agent/release-readiness-audit
