# Freeze these exact bytes before collecting confirmatory outcomes.
mode: confirmatory
experimental_unit: seed
pairing: within_base_optimizer
level: 2
token_multiplier: 40
base_optimizers: [adamw]
target_alpha: 2.0
confirmatory_paired_seeds: 10
primary_hypothesis:
  outcome: selected_checkpoint_test_loss
  contrast: wwpgd_minus_baseline
  direction: negative
primary_outcomes: [selected_checkpoint_test_loss]
secondary_outcomes:
  - selected_checkpoint_test_perplexity
  - selected_checkpoint_test_next_token_accuracy
  - validation_loss_auc
  - tokens_to_threshold
  - alpha_distance_to_target
thresholds: [2.5]
fixed_token_budgets: [1000000]
