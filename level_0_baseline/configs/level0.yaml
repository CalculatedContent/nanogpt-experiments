model:
  # MacBook-scale GPT baseline: large enough for meaningful BPE language
  # modeling and WeightWatcher spectra, while remaining practical on an
  # M2 Pro with 16 GB unified memory.
  vocab_size: 50304
  block_size: 256
  n_layer: 4
  n_head: 4
  n_embd: 256
  dropout: 0.0
  bias: false

training:
  batch_size: 8
  grad_accum_steps: 4
  max_steps: 5000
  eval_interval: 100
  eval_batches: 20
  log_interval: 10
  checkpoint_interval: 500
  learning_rate: 0.0006
  min_lr: 0.00006
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  grad_clip: 1.0
  optimizer: adamw
  muon_learning_rate: 0.02
  muon_aux_adamw_learning_rate: 0.0006
  muon_momentum: 0.95
  muon_nesterov: true
  seed: 1337
  compile: false

analysis:
  weightwatcher: true
  weightwatcher_interval: 500
  randomize: false
